<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% if auto_refresh %}
  <meta http-equiv="refresh" content="5">
  {% endif %}
  <title>{% block title %}Pulse Operator Hub{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --healthy: #10b981;
      --degraded: #f59e0b;
      --down: #ef4444;
      --primary: #3b82f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h1, h2, h3 { margin: 0 0 12px 0; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-healthy { background: rgba(16, 185, 129, 0.2); color: var(--healthy); border: 1px solid var(--healthy); }
    .badge-degraded { background: rgba(245, 158, 11, 0.2); color: var(--degraded); border: 1px solid var(--degraded); }
    .badge-down { background: rgba(239, 68, 68, 0.2); color: var(--down); border: 1px solid var(--down); }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
    .spark { display: inline-flex; gap: 4px; align-items: center; }
    .spark-item { padding: 2px 6px; font-size: 11px; border-radius: 3px; background: #334155; }
    .btn {
      background: var(--primary);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #475569; }
    input, textarea, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .timeline { list-style: none; padding: 0; margin: 16px 0; }
    .timeline-item { padding: 12px 16px; border-left: 2px solid var(--primary); margin-left: 8px; position: relative; }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><a href="/ops" style="color: inherit;">Pulse Operator Hub</a></h1>
      <span style="font-size: 13px; color: var(--text-muted);">Current UTC: {{ now_utc }} UTC</span>
    </div>
    <nav>
      <a href="/ops" class="btn btn-secondary">Dashboard</a>
      <a href="/ops/services/new" class="btn" style="margin-left: 8px;">+ Register Service</a>
      <a href="/status" target="_blank" style="margin-left: 16px;">View Public Page &rarr;</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
