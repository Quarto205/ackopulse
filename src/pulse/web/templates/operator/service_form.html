{% extends "base.html" %}

{% block title %}Register Service — Pulse Operator Hub{% endblock %}

{% block content %}
<div style="margin-bottom: 16px;">
  <a href="/ops">&larr; Back to Dashboard</a>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2>Register New Monitored Service</h2>
  {% if error %}
  <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid var(--down); padding: 12px; border-radius: 6px; margin-bottom: 16px; color: #fca5a5;">
    {{ error }}
  </div>
  {% endif %}
  <form method="POST" action="/ops/services/new">
    <label><strong>Service Name</strong> (e.g. Auth Service)</label>
    <input type="text" name="name" placeholder="Billing API" required>

    <label><strong>Slug</strong> (optional, alphanumeric + dashes)</label>
    <input type="text" name="slug" placeholder="billing-api">

    <label><strong>Health Check URL</strong> (must be HTTP/HTTPS)</label>
    <input type="url" name="health_url" placeholder="http://billing-service:8080/health" required>

    <label><strong>Owner / Team</strong></label>
    <input type="text" name="owner" placeholder="billing-team@acko.com" required>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div>
        <label><strong>Check Interval (seconds)</strong></label>
        <input type="number" name="interval_seconds" value="10" min="1" max="3600" required>
      </div>
      <div>
        <label><strong>Target SLO (%)</strong></label>
        <input type="number" step="0.1" name="slo_target" value="99.9" min="50" max="100" required>
      </div>
    </div>

    <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">Save & Monitor Service</button>
  </form>
</div>
{% endblock %}
