[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = src .
testpaths = tests
markers =
    unit_00: Unit 0 smoke tests
    unit_01: Unit 1 backend and database tests
    unit_02: Unit 2 health check engine tests
    unit_03: Unit 3 state and incident engine tests
    unit_04: Unit 4 operator UI tests
    unit_05: Unit 5 public status page tests
    unit_06: Unit 6 notifications and metrics tests
    unit_07: Unit 7 verification and acceptance tests
